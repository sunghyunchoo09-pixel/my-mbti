<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MBTI로 찾는 나의 포켓몬</title>
    <style>
        :root {
            --bg-cream: #FFFDF0;
            --card-cream: #FFFFFF;
            --primary-yellow: #FFD23F;
            --accent-orange: #FF8C42;
            --dark-text: #4A3E3D;
            --muted-text: #7D6D6A;
            --shadow-color: rgba(210, 180, 140, 0.25);
            --border-yellow: #FFE893;
            --button-hover: #FFC414;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-cream);
            color: var(--dark-text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 24px 16px;
            background-image: 
                radial-gradient(var(--border-yellow) 15%, transparent 16%),
                radial-gradient(var(--border-yellow) 15%, transparent 16%);
            background-size: 60px 60px;
            background-position: 0 0, 30px 30px;
        }

        .container {
            width: 100%;
            max-width: 680px;
            background-color: var(--card-cream);
            border-radius: 28px;
            box-shadow: 0 12px 32px var(--shadow-color);
            padding: 36px 28px;
            border: 4px solid #FFF8DC;
            position: relative;
            overflow: hidden;
        }

        header {
            text-align: center;
            margin-bottom: 32px;
        }

        .main-title {
            font-size: 2rem;
            font-weight: 800;
            color: var(--dark-text);
            margin-bottom: 12px;
            word-break: keep-all;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .subtitle {
            font-size: 1.15rem;
            color: var(--muted-text);
            word-break: keep-all;
            font-weight: 500;
        }

        .mbti-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 14px;
        }

        @media (max-width: 580px) {
            .mbti-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 12px;
            }
            .container {
                padding: 24px 18px;
            }
            .main-title {
                font-size: 1.6rem;
            }
            .subtitle {
                font-size: 1rem;
            }
        }

        .mbti-card {
            background-color: #FFFDF5;
            border: 2px solid var(--border-yellow);
            border-radius: 18px;
            padding: 16px 10px;
            text-align: center;
            cursor: pointer;
            transition: all 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            outline: none;
            user-select: none;
        }

        .mbti-card:hover, .mbti-card:focus {
            transform: translateY(-4px) scale(1.02);
            background-color: var(--primary-yellow);
            border-color: var(--accent-orange);
            box-shadow: 0 6px 16px rgba(255, 140, 66, 0.25);
        }

        .mbti-card:active {
            transform: translateY(0) scale(0.98);
        }

        .mbti-type {
            font-size: 1.35rem;
            font-weight: 800;
            color: var(--dark-text);
            letter-spacing: 0.5px;
        }

        .mbti-badge {
            font-size: 0.85rem;
            color: var(--muted-text);
            background-color: rgba(255, 255, 255, 0.8);
            padding: 4px 8px;
            border-radius: 12px;
            font-weight: 600;
            word-break: keep-all;
        }

        .mbti-card:hover .mbti-badge {
            color: var(--dark-text);
            background-color: #FFFFFF;
        }

        .result-container {
            display: none;
            text-align: center;
            animation: fadeIn 0.4s ease-out forwards;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(12px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .mbti-tag {
            display: inline-block;
            background-color: var(--primary-yellow);
            color: var(--dark-text);
            font-weight: 800;
            font-size: 1.1rem;
            padding: 6px 18px;
            border-radius: 20px;
            margin-bottom: 16px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
        }

        .pokemon-emoji {
            font-size: 6.5rem;
            margin: 10px 0;
            line-height: 1;
            filter: drop-shadow(0 8px 12px rgba(0,0,0,0.1));
            display: inline-block;
            transition: transform 0.3s ease;
        }

        .pokemon-emoji:hover {
            transform: scale(1.1) rotate(5deg);
        }

        .pokemon-name {
            font-size: 2.2rem;
            font-weight: 900;
            color: var(--dark-text);
            margin-bottom: 20px;
        }

        .description-box {
            background-color: #FFFDF5;
            border: 2px dashed var(--border-yellow);
            border-radius: 20px;
            padding: 22px 20px;
            margin-bottom: 24px;
            text-align: left;
        }

        .description-box p {
            font-size: 1.1rem;
            line-height: 1.7;
            color: var(--dark-text);
            word-break: keep-all;
            margin-bottom: 8px;
            font-weight: 500;
        }

        .description-box p:last-child {
            margin-bottom: 0;
        }

        .chemistry-box {
            background-color: #FFF3E0;
            border-radius: 16px;
            padding: 16px 20px;
            margin-bottom: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            border: 1px solid #FFE0B2;
        }

        .chemistry-title {
            font-size: 1rem;
            font-weight: 700;
            color: var(--accent-orange);
            white-space: nowrap;
        }

        .chemistry-text {
            font-size: 1.1rem;
            font-weight: 800;
            color: var(--dark-text);
        }

        .retry-btn {
            background-color: var(--accent-orange);
            color: white;
            border: none;
            font-size: 1.2rem;
            font-weight: 800;
            padding: 16px 36px;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.25s ease;
            box-shadow: 0 6px 18px rgba(255, 140, 66, 0.35);
            display: inline-flex;
            align-items: center;
            gap: 8px;
            outline: none;
        }

        .retry-btn:hover, .retry-btn:focus {
            background-color: #E07A38;
            transform: translateY(-2px);
            box-shadow: 0 8px 22px rgba(255, 140, 66, 0.45);
        }

        .retry-btn:active {
            transform: translateY(0);
        }

        footer {
            text-align: center;
            margin-top: 24px;
            font-size: 0.9rem;
            color: var(--muted-text);
        }
    </style>
</head>
<body>

    <main class="container">
        <!-- 메인 헤더 -->
        <header>
            <h1 class="main-title">⚡ MBTI로 찾는 포켓몬 ⚡</h1>
            <p class="subtitle" id="sub-title">나의 성격 유형을 선택하고 어울리는 포켓몬 친구를 만나보세요!</p>
        </header>

        <!-- MBTI 선택 그리드 영역 -->
        <section id="selection-view">
            <div class="mbti-grid" id="mbti-grid-container">
                <!-- JavaScript를 통해 버튼 생성 -->
            </div>
        </section>

        <!-- 결과 출력 영역 -->
        <section id="result-view" class="result-container">
            <div class="mbti-tag" id="result-mbti"></div>
            <div>
                <div class="pokemon-emoji" id="result-emoji"></div>
                <h2 class="pokemon-name" id="result-pokemon"></h2>
            </div>

            <div class="description-box">
                <p id="result-desc-1"></p>
                <p id="result-desc-2"></p>
                <p id="result-desc-3"></p>
            </div>

            <div class="chemistry-box">
                <span class="chemistry-title">❤️ 환상의 짝꿍 MBTI</span>
                <span class="chemistry-text" id="result-chemistry"></span>
            </div>

            <button class="retry-btn" onclick="resetView()">
                <span>🔄</span> 다시 고르기
            </button>
        </section>
    </main>

    <footer>
        <p>⚡ 당신만의 특별한 포켓몬 파트너를 찾았습니다!</p>
    </footer>

        // 페이지 로드 시 MBTI 그리드 생성
        document.addEventListener('DOMContentLoaded', () => {
            const gridContainer = document.getElementById('mbti-grid-container');
            
            Object.keys(pokemonData).forEach(mbti => {
                const item = pokemonData[mbti];
                const card = document.createElement('button');
                card.className = 'mbti-card';
                card.onclick = () => showResult(mbti);
                
                card.innerHTML = `
                    <span class="mbti-type">${mbti}</span>
                    <span class="mbti-badge">${item.badge}</span>
                `;
                
                gridContainer.appendChild(card);
            });
        });

        // 결과 보기
        function showResult(mbti) {
            const data = pokemonData[mbti];
            if (!data) return;

            document.getElementById('result-mbti').textContent = `${mbti} · ${data.badge}`;
            document.getElementById('result-emoji').textContent = data.emoji;
            document.getElementById('result-pokemon').textContent = data.pokemon;
            
            document.getElementById('result-desc-1').textContent = `• ${data.reasons[0]}`;
            document.getElementById('result-desc-2').textContent = `• ${data.reasons[1]}`;
            document.getElementById('result-desc-3').textContent = `• ${data.reasons[2]}`;
            
            document.getElementById('result-chemistry').textContent = data.bestMatch;

            // 화면 전환
            document.getElementById('sub-title').style.display = 'none';
            document.getElementById('selection-view').style.display = 'none';
            
            const resultView = document.getElementById('result-view');
            resultView.style.display = 'block';

            // 스크롤 상단 이동
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // 초기 화면으로 리셋
        function resetView() {
            document.getElementById('result-view').style.display = 'none';
            document.getElementById('selection-view').style.display = 'block';
            document.getElementById('sub-title').style.display = 'block';

            // 스크롤 상단 이동
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }
    </script>
</body>
</html>
